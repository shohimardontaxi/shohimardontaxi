<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shohmardon Taksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .hero { background: linear-gradient(135deg, #ef4444, #f97316); }
    .field-blue { background: linear-gradient(135deg, #dbeafe, #bfdbfe); border: 2px solid #3b82f6; }
    .field-green { background: linear-gradient(135deg, #d1fae5, #a7f3d0); border: 2px solid #10b981; }
    .field-yellow { background: linear-gradient(135deg, #fef3c7, #fde68a); border: 2px solid #f59e0b; }
    .field-pink { background: linear-gradient(135deg, #fce7f3, #fbcfe8); border: 2px solid #ec4899; }
    .field-purple { background: linear-gradient(135deg, #e9d5ff, #d8b4fe); border: 2px solid #a855f7; }
    .field-orange { background: linear-gradient(135deg, #fed7aa, #fdba74); border: 2px solid #f97316; }
    .field-red { background: linear-gradient(135deg, #fecaca, #fca5a5); border: 2px solid #ef4444; }
  </style>
</head>
<body class="bg-gradient-to-b from-purple-700 to-purple-900 min-h-screen pb-12">

  <!-- Header -->
  <div class="hero text-white py-10 text-center">
    <div class="max-w-md mx-auto px-4">
      <div class="flex justify-center mb-4">
        <i class="fa-solid fa-car-side text-6xl"></i>
      </div>
      <h1 class="text-4xl font-bold">Shohmardon Taksi</h1>
      <p class="mt-2 opacity-90">Farg‘ona viloyati — tez, ishonchli va qulay taksi xizmati</p>
      <p class="mt-4 text-xl font-medium">📞 +998 33 835 11 87</p>
    </div>
  </div>

  <div class="max-w-md mx-auto mt-8 px-4">
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
      <form id="taxiForm" class="p-6 space-y-6">
        
        <!-- QAYERDAN -->
        <div>
          <label class="block text-xs font-bold text-blue-700 mb-1.5">📍 QAYERDAN</label>
          <select id="from" required class="field-blue w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
            <option value="">Tanlang</option>
            <option value="Shohmardon">Shohmardon</option>
            <option value="Farg'ona shahri">Farg'ona shahri</option>
            <option value="Marg'ilon">Marg'ilon</option>
            <option value="Qo'qon">Qo'qon</option>
            <option value="Rishton">Rishton</option>
            <option value="Quva">Quva</option>
            <option value="Toshloq">Toshloq</option>
          </select>
        </div>

        <!-- QAYERGA -->
        <div>
          <label class="block text-xs font-bold text-green-700 mb-1.5">🎯 QAYERGA</label>
          <select id="to" required class="field-green w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
            <option value="">Tanlang</option>
            <option value="Shohmardon">Shohmardon</option>
            <option value="Farg'ona shahri">Farg'ona shahri</option>
            <option value="Marg'ilon">Marg'ilon</option>
            <option value="Qo'qon">Qo'qon</option>
            <option value="Toshkent">Toshkent</option>
            <option value="Toshloq">Toshloq</option>
          </select>
        </div>

        <!-- Narx taxmini -->
        <div id="priceEstimate" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center">
          <p class="text-sm text-amber-700">Taxminiy narx: <span id="estimatedPrice" class="font-bold text-lg"></span></p>
        </div>

        <!-- Qolgan maydonlar -->
        <div>
          <label class="block text-xs font-bold text-yellow-700 mb-1.5">👥 NECHA KISHI?</label>
          <input type="number" id="people" min="1" max="15" placeholder="Masalan: 3" required class="field-yellow w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-pink-700 mb-1.5">📅 KETISH SANASI</label>
          <input type="date" id="date" required class="field-pink w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-purple-700 mb-1.5">⏰ KETISH VAQTI</label>
          <input type="text" id="time" placeholder="14:30" required pattern="[0-2][0-9]:[0-5][0-9]"
            class="field-purple w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-orange-700 mb-1.5">🚗 MASHINA TURI</label>
          <select id="car" required class="field-orange w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
            <option value="">Tanlang</option>
            <option value="Yengil avtomobil">Yengil avtomobil</option>
            <option value="Damas">Damas</option>
            <option value="Lacetti">Lacetti</option>
            <option value="JAK 10-15 kishili">JAK 10-15 kishili</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-red-700 mb-1.5">📞 TELEFON RAQAM</label>
          <input type="tel" id="phone" placeholder="+998 XX XXX XX XX" required class="field-red w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-red-500 to-orange-500 text-white font-bold py-5 rounded-2xl text-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> BUYURTMA YUBORISH
        </button>
      </form>
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8513993477:AAGtX_obhdOpswN_S_jLbfMvj9a4ppx7ORE";
    const GROUP_ID = "-1003952071411";

    // Sana formatlash funksiyasi (DD.MM.YYYY)
    function formatDate(dateString) {
      if (!dateString) return "Noma'lum";
      const parts = dateString.split('-');
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    // Narx taxmini
    const priceMap = {
      "Farg'ona shahri": { "Marg'ilon": 80000, "Qo'qon": 150000, "Toshkent": 450000, "Shohmardon": 70000 },
      "Marg'ilon": { "Farg'ona shahri": 80000, "Qo'qon": 120000 },
      "Shohmardon": { "Farg'ona shahri": 60000, "Marg'ilon": 90000, "Toshkent": 480000 }
    };

    function updatePriceEstimate() {
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const estimateDiv = document.getElementById("priceEstimate");
      const priceSpan = document.getElementById("estimatedPrice");

      if (from && to && priceMap[from] && priceMap[from][to]) {
        priceSpan.textContent = priceMap[from][to].toLocaleString('uz-UZ') + " so'm";
        estimateDiv.classList.remove("hidden");
      } else {
        estimateDiv.classList.add("hidden");
      }
    }

    document.getElementById("from").addEventListener("change", updatePriceEstimate);
    document.getElementById("to").addEventListener("change", updatePriceEstimate);

    // Buyurtma yuborish
    document.getElementById("taxiForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const btn = document.getElementById("submitBtn");
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yuborilmoqda...';

      const message = `
🚖 <b>YANGI BUYURTMA!</b> 🚖
📍 <b>Qayerdan:</b> ${document.getElementById("from").value}
🎯 <b>Qayerga:</b> ${document.getElementById("to").value}
👥 <b>Kishi soni:</b> ${document.getElementById("people").value} nafar
📅 <b>Sana:</b> ${formatDate(document.getElementById("date").value)}
⏰ <b>Vaqt:</b> ${document.getElementById("time").value}
🚗 <b>Mashina:</b> ${document.getElementById("car").value}
📞 <b>Telefon:</b> ${document.getElementById("phone").value}
━━━━━━━━━━━━━━━━━
      `;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: GROUP_ID,
            text: message,
            parse_mode: "HTML"
          })
        });

        if (response.ok) {
          alert("✅ Buyurtma muvaffaqiyatli yuborildi!\nTez orada aloqaga chiqamiz.");
          this.reset();
          document.getElementById("priceEstimate").classList.add("hidden");
        } else {
          alert("❌ Xatolik yuz berdi.");
        }
      } catch (error) {
        alert("❌ Internet aloqasi muammosi.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
