<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shohmardon Taksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-purple-700 to-purple-900 min-h-screen p-4">

  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
    <form id="taxiForm" class="p-6 space-y-6">
      <input type="text" id="from" value="Shohmardon" class="w-full p-4 border rounded-2xl" placeholder="Qayerdan">
      <input type="text" id="to" value="Farg'ona" class="w-full p-4 border rounded-2xl" placeholder="Qayerga">
      <input type="tel" id="phone" value="+998338351187" class="w-full p-4 border rounded-2xl" placeholder="Telefon">

      <button type="submit" id="submitBtn" 
        class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-5 rounded-2xl text-lg">
        BUYURTMA YUBORISH
      </button>
    </form>
  </div>

  <script>
    const BOT_TOKEN = "8513993477:AAGtX_obhdOpswN_S_jLbfMvj9a4ppx7ORE";
    const GROUP_ID = "-1003952071411";

    document.getElementById("taxiForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      const message = `🚖 YANGI BUYURTMA\n\nQayerdan: ${document.getElementById("from").value}\nQayerga: ${document.getElementById("to").value}\nTelefon: ${document.getElementById("phone").value}\nVaqt: ${new Date().toLocaleString('uz-UZ')}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: GROUP_ID,
            text: message
          })
        });

        const result = await response.json();
        console.log(result);

        if (response.ok) {
          alert("✅ Buyurtma yuborildi! Guruhni tekshiring.");
        } else {
          alert("Xatolik: " + result.description);
        }
      } catch (err) {
        alert("Xatolik: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "BUYURTMA YUBORISH";
      }
    });
  </script>
</body>
</html>
