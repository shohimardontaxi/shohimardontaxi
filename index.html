<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shohmardon Taksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-purple-700 to-purple-900 min-h-screen pb-12">

  <div class="hero text-white py-8 text-center bg-gradient-to-r from-red-500 to-orange-500">
    <h1 class="text-3xl font-bold">Shohmardon Taksi</h1>
    <p>📞 +998 33 835 11 87</p>
  </div>

  <div class="max-w-md mx-auto mt-8 px-4">
    <form id="taxiForm" class="bg-white p-6 rounded-3xl shadow-2xl space-y-6">
      <!-- Form maydonlari qisqartirildi test uchun -->
      <input type="text" id="from" placeholder="Qayerdan" value="Test" required class="w-full p-4 border rounded-xl">
      <input type="text" id="to" placeholder="Qayerga" value="Test" required class="w-full p-4 border rounded-xl">
      <input type="tel" id="phone" placeholder="Telefon" value="+998338351187" required class="w-full p-4 border rounded-xl">

      <button type="submit" id="submitBtn" 
        class="w-full bg-red-500 text-white py-5 rounded-2xl font-bold text-lg">
        BUYURTMA YUBORISH
      </button>
    </form>
  </div>

  <script>
    const BOT_TOKEN = "8513993477:AAGtX_obhdOpswN_S_jLbfMvj9a4ppx7ORE";
    const GROUP_ID = "-1003952071411";

    document.getElementById("taxiForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      const message = `
🚖 <b>TEST BUYURTMA</b> 🚖
📍 Qayerdan: Test
🎯 Qayerga: Test
📞 Telefon: +998338351187
⏰ Vaqt: ${new Date().toLocaleTimeString('uz-UZ')}
      `;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: GROUP_ID,
            text: message,
            parse_mode: "HTML"
          })
        });

        const result = await response.json();
        console.log("Telegram javobi:", result);   // Brauzer konsolida ko‘rinadi

        if (response.ok) {
          alert("✅ Test muvaffaqiyatli yuborildi! Guruhni tekshiring.");
        } else {
          alert("❌ Telegram xatosi: " + (result.description || "Noma'lum"));
          console.error("Xato:", result);
        }
      } catch (err) {
        alert("❌ Xatolik: " + err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "BUYURTMA YUBORISH";
      }
    });
  </script>
</body>
</html>
