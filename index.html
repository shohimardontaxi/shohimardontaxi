<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shohmardon Taksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-purple-700 to-purple-900 min-h-screen p-6">

  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Shohmardon Taksi - Test</h1>
    
    <form id="taxiForm" class="space-y-4">
      <input type="text" id="phone" value="+998338351187" placeholder="Telefon" class="w-full p-4 border rounded-2xl">
      <button type="submit" id="submitBtn" 
        class="w-full bg-red-500 text-white py-5 rounded-2xl font-bold text-lg">
        TEST XABAR YUBORISH
      </button>
    </form>
  </div>

  <script>
    const BOT_TOKEN = "8513993477:AAGtX_obhdOpswN_S_jLbfMvj9a4ppx7ORE";
    const GROUP_ID = "-1003952071411";   // hozircha shu

    document.getElementById("taxiForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      const message = `🚖 YANGI TEST BUYURTMA\n\nTelefon: +998338351187\nVaqt: ${new Date().toLocaleString('ru-RU')}\n\nTest xabari`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: GROUP_ID,
            text: message
          })
        });

        const result = await response.json();
        console.log("Telegram javobi:", result);

        if (response.ok) {
          alert("✅ Yuborildi deb aytilmoqda!\nGuruhni yangilab ko'ring.");
        } else {
          alert("❌ Xatolik: " + (result.description || "Noma'lum"));
        }
      } catch (err) {
        alert("Internet xatosi: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "TEST XABAR YUBORISH";
      }
    });
  </script>
</body>
</html>
